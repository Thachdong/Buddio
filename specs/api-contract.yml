  /rooms/{roomId}/messages/{messageId}/recall:
    post:
      tags: [Messages]
      operationId: recallMessage
      summary: Thu hồi tin của mình
      description: |
        Chỉ người gửi (BR-22), là thành viên `active` [ASSUMED → Q-044]; được cả khi phòng đang chỉ đọc (Q-035).
        `status = recalled`, `recalled_at`, `text = null`, `images = []`; xóa ngay file ảnh trong Storage (SUP-08,
        ADR-09); là tin cuối → cập nhật `rooms.last_message.status` (SUP-04). Đã thu hồi → `200` (idempotent).
        Tin đã hết hạn / phòng đã xóa → `404` (FLOW-10b E1).
      x-business: [BIZ-10]
      x-screens: [SCR-05.A8]
      x-roles: [ACT-03, ACT-04]
      x-supporting: [SUP-04, SUP-08, SUP-09]
      x-nfr: [NFR-02, NFR-19]
      x-errors: [ROOM_NOT_FOUND, NOT_ROOM_MEMBER, MESSAGE_NOT_FOUND, NOT_MESSAGE_SENDER]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Tin đã thu hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: 01JCZ4M8Q7T2K9X3V5B6N8R0WA
                roomId: room_8aQ1
                kind: user
                senderUid: u_7Hq2Lx
                text: null
                images: []
                status: recalled
                createdAt: '2026-11-12T07:05:12Z'
                recalledAt: '2026-11-12T07:06:00Z'
                expireAt: '2026-11-19T07:05:12Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`NOT_ROOM_MEMBER` · `NOT_MESSAGE_SENDER` (BR-22)'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`ROOM_NOT_FOUND` · `MESSAGE_NOT_FOUND`'
        '500':
          $ref: '#/components/responses/InternalError'

  /rooms/{roomId}/messages/{messageId}/image-urls:
    get:
      tags: [Messages]
      operationId: listMessageImageUrls
      summary: Lấy link xem ảnh của một tin
      description: |
        Chỉ thành viên `active` (NFR-13). Cấp signed URL đọc từng ảnh, hết hạn tại `min(now + 1 giờ, expire_at)`
        (ADR-09, ADR-10). Tin đã quá hạn → `404`; tin đã thu hồi → `409 MESSAGE_RECALLED`. Không phân trang (≤ 10 ảnh).
      x-business: [BIZ-10]
      x-screens: [SCR-05.A9]
      x-roles: [ACT-03, ACT-04]
      x-supporting: [SUP-08]
      x-nfr: [NFR-13]
      x-errors: [ROOM_NOT_FOUND, NOT_ROOM_MEMBER, MESSAGE_NOT_FOUND, MESSAGE_RECALLED]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Link xem ảnh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageImageUrls'
              example:
                messageId: 01JCZ4M8Q7T2K9X3V5B6N8R0WA
                expiresAt: '2026-11-12T08:05:12Z'
                items:
                  - index: 0
                    url: https://storage.googleapis.com/buddio-prod/rooms/room_8aQ1/messages/01JCZ4M8Q7T2K9X3V5B6N8R0WA/0.jpg?X-Goog-Signature=abc
                    contentType: image/jpeg
                    width: 1280
                    height: 960
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`NOT_ROOM_MEMBER` (BR-20, NFR-13)'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`ROOM_NOT_FOUND` · `MESSAGE_NOT_FOUND`'
        '409':
          $ref: '#/components/responses/Conflict'
          description: '`MESSAGE_RECALLED` (BR-22)'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/{notificationId}:
    patch:
      tags: [Notifications]
      operationId: updateNotification
      summary: Đánh dấu một thông báo đã đọc
      description: Chỉ chủ thông báo. `read = true`, `read_at = now`; đã đọc rồi → `200` (idempotent). Không cho đặt lại chưa đọc.
      x-business: []
      x-screens: [SCR-10.A1]
      x-roles: [ACT-01]
      x-supporting: [SUP-03]
      x-errors: [VALIDATION_FAILED, NOTIFICATION_NOT_FOUND]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUpdate'
            example:
              read: true
      responses:
        '200':
          description: Thông báo sau cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                id: nt_33aa
                type: friend_request_received
                actorUid: u_7Hq2Lx
                refType: friend_request
                refId: fr_01HZX8
                read: true
                readAt: '2026-11-12T08:00:00Z'
                createdAt: '2026-11-12T03:20:00Z'
                expireAt: '2026-12-12T03:20:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: '`NOTIFICATION_NOT_FOUND` (không tồn tại / đã quá 30 ngày — NFR-21)'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsAsRead
      summary: Đánh dấu tất cả thông báo đã đọc
      description: |
        Batch cập nhật mọi thông báo `read = false` của tôi có `created_at ≤ upTo` (mặc định: now) → tránh đánh dấu
        thông báo tới sau lúc người dùng bấm [ASSUMED → Q-044]. Chia lô ≤ 500 ghi.
      x-business: []
      x-screens: [SCR-10.A2]
      x-roles: [ACT-01]
      x-supporting: [SUP-03]
      x-errors: [VALIDATION_FAILED]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationReadAll'
            example:
              upTo: '2026-11-12T08:00:00Z'
      responses:
        '200':
          description: Số thông báo đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResult'
              example:
                updatedCount: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Uptime check
      description: Dùng cho Cloud Monitoring uptime check (ADR-12, NFR-09, NFR-26). Không cần xác thực, không trả dữ liệu nghiệp vụ.
      x-business: []
      x-screens: []
      x-roles: []
      x-nfr: [NFR-09, NFR-26]
      security: []
      responses:
        '200':
          description: Hệ thống hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token (Google provider) lấy từ Firebase Auth client: `Authorization: Bearer <idToken>`.
        Server `verifyIdToken(token, checkRevoked = true)` + kiểm phiên 30 ngày (ADR-06, NFR-11).

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      description: id phòng (`rooms/{roomId}`)
      schema:
        type: string
        minLength: 1
        maxLength: 64
    MessageId:
      name: messageId
      in: path
      required: true
      description: id tin do client sinh trước khi gửi (NFR-10). [ASSUMED → Q-044] ULID / UUID / Firestore auto-id.
      schema:
        $ref: '#/components/schemas/MessageId'
    RequestId:
      name: requestId
      in: path
      required: true
      description: id lời mời kết bạn (`friend_requests/{id}`)
      schema:
        type: string
        minLength: 1
        maxLength: 64
    MemberUid:
      name: memberUid
      in: path
      required: true
      description: uid thành viên trong phòng
      schema:
        $ref: '#/components/schemas/Uid'

  responses:
    BadRequest:
      description: '`VALIDATION_FAILED` — request sai cấu trúc / kiểu'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: Dữ liệu gửi lên không hợp lệ
            details:
              - field: retention
                code: invalid_enum_value
                message: Giá trị phải là short hoặc long
    Unauthorized:
      description: '`UNAUTHENTICATED` · `TOKEN_REVOKED` · `SESSION_EXPIRED` (NFR-11)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SESSION_EXPIRED
            message: Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại
    Forbidden:
      description: Không có quyền — `CONSENT_REQUIRED` hoặc mã cụ thể của operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_ROOM_HOST
            message: Bạn không có quyền thực hiện thao tác này
    NotFound:
      description: Không tìm thấy đối tượng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ROOM_NOT_FOUND
            message: Phòng không còn tồn tại
    Conflict:
      description: Xung đột trạng thái nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            readOnly:
              summary: BR-13
              value:
                code: ROOM_READ_ONLY
                message: Phòng đang ở chế độ chỉ đọc
            cooldown:
              summary: BR-10
              value:
                code: REJECT_COOLDOWN
                message: Chưa thể gửi lại, thử lại sau
                details:
                  - code: retry_after
                    retryAfter: '2026-11-13T02:15:00Z'
            roomFull:
              summary: BR-15
              value:
                code: ROOM_FULL
                message: Phòng đã đủ 50 thành viên
                details:
                  - code: remaining_slots
                    remainingSlots: 0
    Gone:
      description: Đối tượng không còn hiệu lực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVITE_LINK_INVALID
            message: Link không còn hiệu lực, hãy xin người mời link mới
    UnprocessableEntity:
      description: Vi phạm quy tắc nghiệp vụ về dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFriends:
              summary: BR-18
              value:
                code: MEMBERS_NOT_FRIENDS
                message: Người này không còn trong danh sách bạn bè
                details:
                  - field: memberUids
                    code: not_friend
                    uid: u_2Mn8Rt
            tooLarge:
              summary: BR-21
              value:
                code: IMAGES_TOO_LARGE
                message: Tổng dung lượng ảnh vượt 10MB
    TooManyRequests:
      description: Vượt giới hạn tần suất
      headers:
        Retry-After:
          description: Số giây cần chờ
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: EMAIL_LOOKUP_RATE_LIMITED
            message: Bạn đã tra quá nhiều email, thử lại sau
            details:
              - code: retry_after
                retryAfter: '2026-11-12T09:00:00Z'
    InternalError:
      description: '`INTERNAL_ERROR`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Có lỗi xảy ra, vui lòng thử lại

  schemas:
    # ---------- Chung ----------
    Uid:
      type: string
      minLength: 1
      maxLength: 128
      description: uid Firebase Auth
    MessageId:
      type: string
      pattern: '^[A-Za-z0-9_-]{16,40}$'
      description: id tin do client sinh (NFR-10)
    Timestamp:
      type: string
      format: date-time
    Email:
      type: string
      format: email
      maxLength: 254
      description: Server chuẩn hóa lowercase + trim trước khi so khớp
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi máy đọc (xem bảng mã lỗi ở `info.description`)
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - TOKEN_REVOKED
            - SESSION_EXPIRED
            - CONSENT_REQUIRED
            - DISPLAY_NAME_INVALID
            - EMAIL_INVALID
            - EMAIL_LOOKUP_RATE_LIMITED
            - CANNOT_INVITE_SELF
            - FRIEND_TARGET_NOT_FOUND
            - ALREADY_FRIENDS
            - FRIEND_REQUEST_ALREADY_PENDING
            - REJECT_COOLDOWN
            - FRIEND_REQUEST_NOT_FOUND
            - FRIEND_REQUEST_FORBIDDEN
            - FRIEND_REQUEST_NOT_PENDING
            - INVITE_LINK_INVALID
            - INVITE_LINK_WRONG_ACCOUNT
            - NOT_FRIENDS
            - USER_NOT_FOUND
            - CANNOT_BLOCK_SELF
            - ALREADY_BLOCKED
            - BLOCK_NOT_FOUND
            - ROOM_NOT_FOUND
            - NOT_ROOM_MEMBER
            - NOT_ROOM_HOST
            - ROOM_FULL
            - MEMBERS_NOT_FRIENDS
            - ROOM_TTL_INVALID
            - ROOM_NAME_TOO_LONG
            - MEMBER_ALREADY_IN_ROOM
            - MEMBER_NOT_IN_ROOM
            - CANNOT_TARGET_SELF
            - HOST_TRANSFER_REQUIRED
            - ROOM_READ_ONLY
            - MESSAGE_EMPTY
            - MESSAGE_TOO_LONG
            - TOO_MANY_IMAGES
            - IMAGES_TOO_LARGE
            - INVALID_IMAGE_TYPE
            - UPLOAD_NOT_FOUND
            - MESSAGE_ID_CONFLICT
            - MESSAGE_NOT_FOUND
            - NOT_MESSAGE_SENDER
            - MESSAGE_RECALLED
            - NOTIFICATION_NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
          description: Thông điệp tiếng Việt để hiển thị (NFR-24); không chứa email / nội dung tin (NFR-27)
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      description: Chi tiết lỗi; ngoài các field dưới có thể có field theo mã lỗi (`uid`, `retryAfter`, `remainingSlots`, `friendUid`)
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
        uid:
          $ref: '#/components/schemas/Uid'
        friendUid:
          $ref: '#/components/schemas/Uid'
        retryAfter:
          $ref: '#/components/schemas/Timestamp'
        remainingSlots:
          type: integer
          minimum: 0
      additionalProperties: true

    # ---------- Tài khoản ----------
    Me:
      type: object
      description: Hồ sơ của chính tôi (TBL-01 + TBL-02, bỏ cột nội bộ)
      required: [uid, email, displayName, anonymous, showOnline, status, consentAt, createdAt]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        email:
          $ref: '#/components/schemas/Email'
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        photoUrl:
          type: [string, 'null']
          format: uri
        anonymous:
          type: boolean
          description: Chế độ ẩn danh (BR-02), mặc định true
        showOnline:
          type: boolean
          description: Hiển thị online (BR-25), mặc định true
        status:
          type: string
          enum: [active, deleted]
        consentAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    MeUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: Trim trước khi kiểm; trống / > 50 ký tự → `DISPLAY_NAME_INVALID` (BR-29)
        anonymous:
          type: boolean
        showOnline:
          type: boolean
    Limits:
      type: object
      description: Giới hạn nghiệp vụ chỉnh được (TBL-11, NFR-08)
      required: [maxRoomMembers, maxImagesPerMessage, maxImageBytesPerMessage, ttlDaysOptions, inviteTtlDays, notificationTtlDays, emailLookupsPerHour, rejectCooldownHours, maxMessageChars, displayNameMax, roomNameMax, sessionIdleDays]
      properties:
        maxRoomMembers:
          type: integer
          minimum: 2
        maxImagesPerMessage:
          type: integer
          minimum: 1
        maxImageBytesPerMessage:
          type: integer
          minimum: 1
        ttlDaysOptions:
          type: array
          items:
            type: integer
            minimum: 1
        inviteTtlDays:
          type: integer
        notificationTtlDays:
          type: integer
        emailLookupsPerHour:
          type: integer
        rejectCooldownHours:
          type: integer
        maxMessageChars:
          type: integer
        displayNameMax:
          type: integer
        roomNameMax:
          type: integer
        sessionIdleDays:
          type: integer
    MeWithLimits:
      type: object
      required: [me, limits]
      properties:
        me:
          $ref: '#/components/schemas/Me'
        limits:
          $ref: '#/components/schemas/Limits'
    SessionResult:
      type: object
      required: [accountStatus]
      properties:
        accountStatus:
          type: string
          enum: [active, consent_required]
        me:
          $ref: '#/components/schemas/Me'
        limits:
          $ref: '#/components/schemas/Limits'
        googleProfile:
          type: object
          description: Chỉ khi `consent_required` — thông tin Google để hiện màn đồng ý chính sách
          properties:
            email:
              $ref: '#/components/schemas/Email'
            displayName:
              type: [string, 'null']
            photoUrl:
              type: [string, 'null']
              format: uri
        policyVersion:
          type: string
          description: Phiên bản chính sách quyền riêng tư cần đồng ý (chỉ khi `consent_required`) [ASSUMED → Q-044]
    AccountCreate:
      type: object
      required: [acceptPrivacyPolicy, policyVersion]
      additionalProperties: false
      properties:
        acceptPrivacyPolicy:
          type: boolean
          const: true
          description: Phải là true (NFR-17)
        policyVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: Phiên bản chính sách người dùng đã đọc [ASSUMED → Q-044]
    AccountDeleted:
      type: object
      required: [status, deletedAt]
      properties:
        status:
          type: string
          const: deleted
        deletedAt:
          $ref: '#/components/schemas/Timestamp'

    # ---------- Người dùng (công khai) ----------
    UserSummary:
      type: object
      description: Phần công khai (TBL-02) — bạn bè / người chung phòng / người mời. `status = deleted` → hiển thị "Người dùng đã xóa" (BR-28)
      required: [uid, displayName, status]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        displayName:
          type: [string, 'null']
        photoUrl:
          type: [string, 'null']
          format: uri
        status:
          type: string
          enum: [active, deleted]
    LookupUser:
      type: object
      description: Người được tìm thấy khi tra email — chỉ tên & ảnh (BIZ-03 e)
      required: [displayName]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
          description: Chỉ có khi `already_friends`
        displayName:
          type: string
        photoUrl:
          type: [string, 'null']
          format: uri

    # ---------- Tra email / lời mời ----------
    EmailLookupCreate:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
    EmailLookupResult:
      type: object
      description: |
        Kết quả tra email (BIZ-03 a–f). Với `not_found` body **chỉ có** `result` — giống hệt nhau cho mọi lý do (BR-04).
      required: [result]
      properties:
        result:
          type: string
          enum: [self, already_friends, pending_sent, reject_cooldown, found, not_found]
          description: |
            `self` (a) · `already_friends` (b) · `pending_sent` (c, kèm `requestId` để Thu hồi) ·
            `reject_cooldown` (d, kèm `retryAfter`) · `found` (e, kèm `user`) · `not_found` (f → Copy link mời)
        user:
          $ref: '#/components/schemas/LookupUser'
        requestId:
          type: string
          description: Chỉ khi `pending_sent`
        retryAfter:
          $ref: '#/components/schemas/Timestamp'
          description: Chỉ khi `reject_cooldown` — `responded_at + rejectCooldownHours` (BR-10)
    FriendRequestCreate:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
          description: Email đã tra ở bước trước; server kiểm lại BR-05 (FLOW-03 E3)
    FriendRequest:
      type: object
      description: Lời mời kết bạn (TBL-04, bỏ `expire_at`)
      required: [id, fromUid, toUid, channel, status, createdAt]
      properties:
        id:
          type: string
        fromUid:
          $ref: '#/components/schemas/Uid'
        toUid:
          $ref: '#/components/schemas/Uid'
        channel:
          type: string
          enum: [in_app, link]
        status:
          type: string
          enum: [pending, accepted, rejected, withdrawn, closed]
        closedReason:
          type: [string, 'null']
          enum: [became_friends, blocked, account_deleted, null]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        respondedAt:
          type: [string, 'null']
          format: date-time
    FriendRequestAccepted:
      type: object
      required: [request, friendship, reopenedRoomIds]
      properties:
        request:
          $ref: '#/components/schemas/FriendRequest'
        friendship:
          $ref: '#/components/schemas/Friendship'
        reopenedRoomIds:
          type: array
          description: Phòng 2 người được mở lại khỏi chỉ đọc (BR-13)
          items:
            type: string
    Friendship:
      type: object
      required: [friendUid, since]
      properties:
        friendUid:
          $ref: '#/components/schemas/Uid'
        since:
          $ref: '#/components/schemas/Timestamp'

    # ---------- Link mời ----------
    InviteLinkCreate:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
    InviteLink:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: '`{origin}/invite/{token}` — token AES-256-GCM base64url, email không đọc được (BR-06, NFR-14)'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    InviteLinkOpen:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
          description: Phần `{token}` của `/invite/{token}` (base64url)
    InviteLinkOpenResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [login_required, pending_request]
          description: '`login_required` khi gọi không có ID token và link còn hạn'
        created:
          type: boolean
          description: true nếu vừa tạo lời mời mới; false nếu dùng lại lời mời đang chờ (Q-029)
        request:
          $ref: '#/components/schemas/FriendRequest'
        inviter:
          $ref: '#/components/schemas/UserSummary'

    # ---------- Bạn bè / chặn ----------
    RelationChangeResult:
      type: object
      required: [readOnlyRoomIds]
      properties:
        readOnlyRoomIds:
          type: array
          description: Phòng 2 người vừa chuyển chỉ đọc (BR-13)
          items:
            type: string
    BlockCreate:
      type: object
      required: [blockedUid]
      additionalProperties: false
      properties:
        blockedUid:
          $ref: '#/components/schemas/Uid'
    Block:
      type: object
      required: [blockedUid, createdAt]
      properties:
        blockedUid:
          $ref: '#/components/schemas/Uid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    BlockCreated:
      type: object
      required: [block, unfriended, closedRequestIds, readOnlyRoomIds]
      properties:
        block:
          $ref: '#/components/schemas/Block'
        unfriended:
          type: boolean
          description: true nếu quan hệ bạn bè vừa bị hủy (BR-12)
        closedRequestIds:
          type: array
          items:
            type: string
        readOnlyRoomIds:
          type: array
          items:
            type: string

    # ---------- Phòng ----------
    RoomName:
      type: [string, 'null']
      maxLength: 50
      description: Tối đa 50 ký tự sau trim (Q-037); null / rỗng → hiển thị tên thành viên (Q-012)
    RoomCreate:
      type: object
      required: [memberUids, retention]
      additionalProperties: false
      properties:
        memberUids:
          type: array
          description: Bạn của người tạo, không gồm người tạo (BR-15, BR-18); 1 … `maxRoomMembers - 1`
          minItems: 1
          maxItems: 49
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uid'
        name:
          $ref: '#/components/schemas/RoomName'
        retention:
          type: string
          enum: [short, long]
          description: Không đổi được sau khi tạo (BR-16)
        ttlDays:
          type: integer
          enum: [1, 2, 3, 7, 30, 90]
          description: Bắt buộc khi `short`, không được gửi khi `long` (BR-16); giá trị hợp lệ theo `ttlDaysOptions`
      if:
        properties:
          retention:
            const: short
      then:
        required: [ttlDays]
      else:
        not:
          required: [ttlDays]
    RoomUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/RoomName'
    RoomMembersAdd:
      type: object
      required: [uids]
      additionalProperties: false
      properties:
        uids:
          type: array
          minItems: 1
          maxItems: 49
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uid'
    HostTransfer:
      type: object
      required: [newHostUid]
      additionalProperties: false
      properties:
        newHostUid:
          $ref: '#/components/schemas/Uid'
    RoomLeave:
      type: object
      additionalProperties: false
      properties:
        newHostUid:
          $ref: '#/components/schemas/Uid'
          description: Bắt buộc khi người rời là host và phòng còn người khác (BR-19)
    LastMessage:
      type: object
      description: Tóm tắt tin cuối (SUP-04); client ẩn nếu đã quá `expireAt`
      required: [id, kind, status, createdAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [user, system]
        senderUid:
          type: [string, 'null']
        textPreview:
          type: [string, 'null']
          maxLength: 100
        imageCount:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [sent, recalled]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expireAt:
          type: [string, 'null']
          format: date-time
    Room:
      type: object
      description: Phòng (TBL-07, bỏ `pair_key`, `schema_version`, `deleted_at`)
      required: [id, hostUid, retention, status, memberUids, memberCount, readOnly, lastMessageAt, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/RoomName'
        hostUid:
          $ref: '#/components/schemas/Uid'
        retention:
          type: string
          enum: [short, long]
        ttlDays:
          type: [integer, 'null']
          enum: [1, 2, 3, 7, 30, 90, null]
        status:
          type: string
          enum: [active, deleted]
        memberUids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Uid'
        memberCount:
          type: integer
          minimum: 1
          maximum: 50
        readOnly:
          type: boolean
          description: BR-13
        lastMessage:
          oneOf:
            - $ref: '#/components/schemas/LastMessage'
            - type: 'null'
        lastMessageAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          $ref: '#/components/schemas/Uid'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    RoomDeleted:
      type: object
      required: [id, status, deletedAt]
      properties:
        id:
          type: string
        status:
          type: string
          const: deleted
        deletedAt:
          $ref: '#/components/schemas/Timestamp'
    RoomLeft:
      type: object
      required: [roomId, roomDeleted]
      properties:
        roomId:
          type: string
        roomDeleted:
          type: boolean
          description: true khi host là người cuối cùng rời (BR-19)
        newHostUid:
          $ref: '#/components/schemas/Uid'

    # ---------- Tin nhắn ----------
    ReadMarkerUpdate:
      type: object
      additionalProperties: false
      properties:
        upToMessageId:
          $ref: '#/components/schemas/MessageId'
    ReadMarker:
      type: object
      required: [roomId, lastReadAt]
      properties:
        roomId:
          type: string
        lastReadAt:
          $ref: '#/components/schemas/Timestamp'
    MessageImageUpload:
      type: object
      required: [uploadPath]
      additionalProperties: false
      properties:
        uploadPath:
          type: string
          pattern: '^uploads/[^/]+/[A-Za-z0-9_-]+$'
          description: Đường dẫn ảnh tạm đã upload ở Storage `uploads/{uid}/{uuid}` (ADR-10); `{uid}` phải là người gửi
        width:
          type: integer
          minimum: 1
          description: '[ASSUMED → Q-044] Kích thước do client đọc lúc tạo ảnh xem trước, để giữ chỗ hiển thị'
        height:
          type: integer
          minimum: 1
    MessageCreate:
      type: object
      additionalProperties: false
      description: Phải có `text` (không trống sau trim) hoặc ít nhất 1 ảnh (BR-21)
      properties:
        text:
          type: string
          maxLength: 1000
        images:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MessageImageUpload'
      anyOf:
        - required: [text]
          properties:
            text:
              minLength: 1
        - required: [images]
          properties:
            images:
              minItems: 1
    MessageImage:
      type: object
      required: [index, contentType, sizeBytes]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 9
        contentType:
          type: string
          pattern: '^image/'
        sizeBytes:
          type: integer
          minimum: 1
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
    SystemEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [room_created, member_added, member_kicked, member_left, host_transferred, room_renamed]
        actorUid:
          type: [string, 'null']
        targetUid:
          type: [string, 'null']
        roomName:
          type: [string, 'null']
    Message:
      type: object
      description: Tin nhắn (TBL-09, bỏ `images[].path`, `schema_version`)
      required: [id, roomId, kind, status, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/MessageId'
        roomId:
          type: string
        kind:
          type: string
          enum: [user, system]
        senderUid:
          type: [string, 'null']
        text:
          type: [string, 'null']
          maxLength: 1000
        images:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MessageImage'
        systemEvent:
          oneOf:
            - $ref: '#/components/schemas/SystemEvent'
            - type: 'null'
        status:
          type: string
          enum: [sent, recalled]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        recalledAt:
          type: [string, 'null']
          format: date-time
        expireAt:
          type: [string, 'null']
          format: date-time
          description: null khi phòng lâu dài (BR-16)
    MessageImageUrls:
      type: object
      required: [messageId, expiresAt, items]
      properties:
        messageId:
          $ref: '#/components/schemas/MessageId'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: '`min(now + 1h, message.expireAt)`'
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required: [index, url]
            properties:
              index:
                type: integer
                minimum: 0
              url:
                type: string
                format: uri
                description: Signed URL đọc (V4), không công khai (NFR-13)
              contentType:
                type: string
              width:
                type: [integer, 'null']
              height:
                type: [integer, 'null']

    # ---------- Thông báo ----------
    Notification:
      type: object
      description: Thông báo (TBL-10)
      required: [id, type, refType, refId, read, createdAt, expireAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [friend_request_received, friend_request_rejected, friend_request_accepted, room_member_added, room_member_kicked, room_disbanded, room_host_received]
        actorUid:
          type: [string, 'null']
        refType:
          type: string
          enum: [friend_request, room]
        refId:
          type: string
        roomName:
          type: [string, 'null']
        read:
          type: boolean
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expireAt:
          $ref: '#/components/schemas/Timestamp'
    NotificationUpdate:
      type: object
      required: [read]
      additionalProperties: false
      properties:
        read:
          type: boolean
          const: true
    NotificationReadAll:
      type: object
      additionalProperties: false
      properties:
        upTo:
          $ref: '#/components/schemas/Timestamp'
    NotificationReadAllResult:
      type: object
      required: [updatedCount]
      properties:
        updatedCount:
          type: integer
          minimum: 0

    # ---------- Hệ thống ----------
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
