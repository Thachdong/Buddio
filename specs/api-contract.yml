  /invite-links/open:
    post:
      tags: [InviteLinks]
      operationId: openInviteLink
      summary: Kiểm tra link mời & lấy / tạo lời mời
      description: |
        Token gửi trong body (không đặt trên URL API để không vào log). Xác thực **tùy chọn**:
        - **Chưa đăng nhập** (không có header): chỉ giải mã + kiểm hạn (FLOW-05 bước 2) → `200 {status: login_required}`
          hoặc `410 INVITE_LINK_INVALID`. Không trả bất kỳ thông tin người mời / email nào.
        - **Đã đăng nhập**: email đăng nhập ≠ `emailNorm` → `403 INVITE_LINK_WRONG_ACCOUNT` (không hiện email — BR-07);
          người mời đã xóa / đã là bạn / có chặn chiều nào → `410 INVITE_LINK_INVALID` (BR-06);
          đã có lời mời `pending` từ người mời tới mình → trả lời mời đó (`created = false`, Q-029);
          chưa có → tạo `friend_requests` (`channel = link`, `pending`) + thông báo `friend_request_received`
          (`created = true`). Mở lại link còn hạn sau khi đã từ chối → tạo lời mời mới, **không** áp BR-10 (Q-036).
        - Có ID token nhưng chưa có tài khoản → `403 CONSENT_REQUIRED` (client đưa sang SCR-01.A2 rồi quay lại).
