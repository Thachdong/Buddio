openapi: 3.1.0
info:
  title: Buddio API
  version: 0.1.0
  summary: API ghi dữ liệu (write path) của Buddio — Next.js Route Handlers `/api/*` trên Firebase App Hosting.
  description: |
    Nguồn: `specs/ui-ux/wireframe.md` mục 4 (bảng thao tác, chỉ các thao tác Kênh = `API`),
    `idea/business.md` (BR, ma trận Actor × BIZ), `idea/business-flows.md` (FLOW, SUP, NFR),
    `specs/database.md` (TBL), `specs/tech-stack.md` (ADR-03, ADR-05, ADR-06, ADR-08, ADR-09, ADR-10, ADR-11).
    Cập nhật: 2026-11-12.

    ## Phạm vi
    - Theo ADR-03: **mọi thao tác ghi** đi qua API này. Client **chỉ đọc** Firestore bằng realtime listener
      (danh sách phòng, tin nhắn, thành viên, bạn bè, lời mời, thông báo, hồ sơ) — các thao tác Kênh `FS`,
      `RTDB` (presence, đang soạn), `ST` (upload ảnh tạm vào `uploads/{uid}/…`) và `NAV` **không có endpoint**.
    - Vì vậy API **không có endpoint danh sách có phân trang**. Nếu sau này cần, quy ước là cursor:
      query `cursor` (opaque string) + `limit` (1–100, mặc định 50), response `{items, nextCursor}`. [ASSUMED → Q-044]
    - Việc nền (`purgeRoom`, `purgeAccount` — ADR-11) là Cloud Functions task queue, không phải HTTP endpoint;
      xóa theo hạn do Firestore TTL / Storage lifecycle làm (ADR-09) → không có endpoint.

    ## Xác thực (ADR-06)
    - Client đăng nhập Firebase Authentication (Google provider), lấy **Firebase ID token** và gửi
      `Authorization: Bearer <idToken>` ở mọi request.
    - Server `verifyIdToken(token, checkRevoked = true)`; kiểm phiên không dùng quá `sessionIdleDays` (30 ngày,
      theo `users.last_active_at`) → `revokeRefreshTokens` + `401 SESSION_EXPIRED` (NFR-11).
    - Người dùng đã có Firebase ID token nhưng **chưa đồng ý chính sách** (chưa có tài khoản Buddio) chỉ gọi được
      `createSession`, `createAccount`, `openInviteLink`; endpoint khác trả `403 CONSENT_REQUIRED` (NFR-17).

    ## Quy ước
    - JSON `camelCase` (DB là `snake_case`). Thời gian ISO-8601 UTC (`date-time`).
    - Không lộ cột nội bộ: `email_norm`, `lookup_window`, `display_name_custom`, `pair_key`, `schema_version`,
      `deleted_at`, `images[].path` (đường dẫn Storage), payload link mời.
    - Nhật ký server không ghi nội dung tin, ảnh, email dạng đọc được (NFR-27) → email luôn gửi trong **body**, không đặt trên URL.
    - `400 VALIDATION_FAILED` = sai cấu trúc / kiểu (Zod). `422` = vi phạm quy tắc nghiệp vụ về dữ liệu.
      `409` = xung đột trạng thái. Mọi lỗi dùng schema `Error`.
    - Mỗi operation có `x-business`, `x-screens`, `x-roles`; khi có: `x-supporting`, `x-nfr`, `x-errors`.

    ## Bảng mã lỗi nghiệp vụ
    | code | HTTP | Ý nghĩa | Ref |
    |---|---|---|---|
    | VALIDATION_FAILED | 400 | Request sai cấu trúc / kiểu | — |
    | UNAUTHENTICATED | 401 | Thiếu / sai ID token | ADR-06 |
    | TOKEN_REVOKED | 401 | Token đã bị thu hồi (đăng xuất, xóa tài khoản) | NFR-11 |
    | SESSION_EXPIRED | 401 | Quá 30 ngày không dùng | NFR-11 |
    | CONSENT_REQUIRED | 403 | Chưa đồng ý chính sách / chưa có tài khoản | NFR-17, BR-01 |
    | DISPLAY_NAME_INVALID | 422 | Tên hiển thị trống hoặc > 50 ký tự | BR-29 |
    | EMAIL_INVALID | 422 | Email sai định dạng | BIZ-03 E1 |
    | EMAIL_LOOKUP_RATE_LIMITED | 429 | Tra quá 100 email / giờ | NFR-16 |
    | CANNOT_INVITE_SELF | 422 | Mời / tạo link cho chính email của mình | ENT-02 |
    | FRIEND_TARGET_NOT_FOUND | 404 | "Không tìm thấy" khi gửi lời mời (không lộ lý do) | BR-04, BR-05 |
    | ALREADY_FRIENDS | 409 | Hai người đã là bạn | BR-05, BR-09 |
    | FRIEND_REQUEST_ALREADY_PENDING | 409 | Đã có lời mời đang chờ cùng chiều | BR-08 |
    | REJECT_COOLDOWN | 409 | Bị từ chối chưa đủ 24 giờ | BR-10 |
    | FRIEND_REQUEST_NOT_FOUND | 404 | Lời mời không tồn tại / không liên quan tới mình | — |
    | FRIEND_REQUEST_FORBIDDEN | 403 | Sai vai trò (người gửi bấm chấp nhận, người nhận bấm thu hồi) | BR-08, BIZ-04 |
    | FRIEND_REQUEST_NOT_PENDING | 409 | "Lời mời không còn hiệu lực" | BIZ-04 E1 |
    | INVITE_LINK_INVALID | 410 | Link hỏng / hết hạn / người mời đã xóa / đã là bạn / có chặn | BR-06 |
    | INVITE_LINK_WRONG_ACCOUNT | 403 | Email đăng nhập khác email được mời (không hiện email) | BR-07 |
    | NOT_FRIENDS | 404 | "Hai bạn không còn là bạn bè" | BR-12 |
    | USER_NOT_FOUND | 404 | Người dùng không tồn tại / đã xóa / không liên quan | BR-28 |
    | CANNOT_BLOCK_SELF | 422 | Tự chặn mình | ENT-05 |
    | ALREADY_BLOCKED | 409 | Đã đang chặn người này | BR-14 |
    | BLOCK_NOT_FOUND | 404 | Không đang chặn người này | BR-14 |
    | ROOM_NOT_FOUND | 404 | Phòng không tồn tại / đã xóa | ENT-06 |
    | NOT_ROOM_MEMBER | 403 | Không còn là thành viên đang tham gia | BR-20 |
    | NOT_ROOM_HOST | 403 | "Bạn không có quyền thực hiện thao tác này" | BR-18 |
    | ROOM_FULL | 409 | Vượt 50 thành viên | BR-15 |
    | MEMBERS_NOT_FRIENDS | 422 | Người được chọn không (còn) là bạn của host | BR-18, BR-15 |
    | ROOM_TTL_INVALID | 422 | Thiếu / sai thời hạn tin của phòng ngắn hạn | BR-16 |
    | ROOM_NAME_TOO_LONG | 422 | Tên phòng > 50 ký tự | Q-037 |
    | MEMBER_ALREADY_IN_ROOM | 409 | Người được thêm đã ở trong phòng | BR-15 |
    | MEMBER_NOT_IN_ROOM | 409 | "Người này không còn trong phòng" | BIZ-09 |
    | CANNOT_TARGET_SELF | 422 | Host tự kick / tự chuyển quyền cho mình | BR-17 |
    | HOST_TRANSFER_REQUIRED | 422 | Host rời phòng còn người khác mà chưa chọn người nhận quyền | BR-19 |
    | ROOM_READ_ONLY | 409 | Phòng 2 người đang chỉ đọc | BR-13 |
    | MESSAGE_EMPTY | 422 | Tin không có chữ lẫn ảnh | BR-21 |
    | MESSAGE_TOO_LONG | 422 | Chữ > 1000 ký tự | BR-21 |
    | TOO_MANY_IMAGES | 422 | > 10 ảnh | BR-21 |
    | IMAGES_TOO_LARGE | 422 | Tổng ảnh > 10MB | BR-21 |
    | INVALID_IMAGE_TYPE | 422 | Tệp không phải ảnh | BR-21 |
    | UPLOAD_NOT_FOUND | 422 | Ảnh tạm không tồn tại / không thuộc người gửi | ADR-10 |
    | MESSAGE_ID_CONFLICT | 409 | `messageId` đã dùng cho tin khác | NFR-10 |
    | MESSAGE_NOT_FOUND | 404 | Tin không tồn tại / đã hết hạn | BR-16 |
    | NOT_MESSAGE_SENDER | 403 | Không phải người gửi tin | BR-22 |
    | MESSAGE_RECALLED | 409 | Tin đã thu hồi (không cấp link ảnh) | BR-22 |
    | NOTIFICATION_NOT_FOUND | 404 | Thông báo không tồn tại / đã quá 30 ngày | NFR-21 |
    | INTERNAL_ERROR | 500 | Lỗi hệ thống | — |
  contact:
    name: Buddio team
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{host}/api
    description: Firebase App Hosting (domain thật chốt khi deploy) [ASSUMED → Q-044]
    variables:
      host:
        default: buddio.example.com
  - url: http://localhost:3000/api
    description: Local (Next.js dev + Firebase Emulator Suite)
security:
  - firebaseIdToken: []
tags:
  - name: Auth
    description: Đăng nhập / đăng xuất / tạo tài khoản (BIZ-01)
  - name: Account
    description: Hồ sơ & cài đặt của tôi, xóa tài khoản (BIZ-02, BIZ-11)
  - name: FriendRequests
    description: Tra email, lời mời kết bạn (BIZ-03, BIZ-04)
  - name: InviteLinks
    description: Link mời tự chứa (BIZ-03 f, BIZ-05, SUP-07)
  - name: Friends
    description: Hủy kết bạn (BIZ-06)
  - name: Blocks
    description: Chặn / bỏ chặn (BIZ-07)
  - name: Rooms
    description: Tạo & quản lý phòng, thành viên (BIZ-08, BIZ-09)
  - name: Messages
    description: Nhắn tin, đã xem, thu hồi, xem ảnh (BIZ-10)
  - name: Notifications
    description: Đánh dấu đã đọc thông báo (SUP-03)
  - name: System
    description: Vận hành (ADR-12)

paths:
  /sessions:
    post:
      tags: [Auth]
      operationId: createSession
      summary: Đăng nhập với Google (bắt đầu phiên Buddio)
      description: |
        Client đã đăng nhập Firebase Auth bằng Google (popup trên desktop, redirect trên điện thoại) và gửi
        Firebase ID token ở header. Server:
        - Tài khoản `active` đã có → cập nhật `profiles.photo_url` theo Google, giữ tên nếu `display_name_custom`,
          cập nhật `users.last_active_at` → `accountStatus = active`.
        - Chưa có tài khoản (lần đầu, hoặc email thuộc tài khoản đã xóa — uid mới, BR-28) → **không tạo gì**,
          trả `accountStatus = consent_required` kèm thông tin Google để hiện màn đồng ý chính sách (NFR-17).
        Việc "đang mở dở link mời" (FLOW-01 bước 9) do client tự giữ `token` và điều hướng → không thuộc API.
      x-business: [BIZ-01]
      x-screens: [SCR-01.A1]
      x-roles: [ACT-01, ACT-02]
      x-nfr: [NFR-11, NFR-17]
      x-errors: [UNAUTHENTICATED, TOKEN_REVOKED]
      responses:
        '200':
          description: Kết quả đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResult'
              examples:
                existing:
                  summary: Đã có tài khoản
                  value:
                    accountStatus: active
                    me:
                      uid: u_7Hq2Lx
                      email: an.nguyen@gmail.com
                      displayName: An Nguyễn
                      photoUrl: https://lh3.googleusercontent.com/a/abc
                      anonymous: true
                      showOnline: true
                      status: active
                      consentAt: '2026-11-01T08:00:00Z'
                      createdAt: '2026-11-01T08:00:00Z'
                    limits:
                      maxRoomMembers: 50
                      maxImagesPerMessage: 10
                      maxImageBytesPerMessage: 10485760
                      ttlDaysOptions: [1, 2, 3, 7, 30, 90]
                      inviteTtlDays: 7
                      notificationTtlDays: 30
                      emailLookupsPerHour: 100
                      rejectCooldownHours: 24
                      maxMessageChars: 1000
                      displayNameMax: 50
                      roomNameMax: 50
                      sessionIdleDays: 30
                firstTime:
                  summary: Lần đầu — cần đồng ý chính sách
                  value:
                    accountStatus: consent_required
                    googleProfile:
                      email: binh.tran@gmail.com
                      displayName: Bình Trần
                      photoUrl: https://lh3.googleusercontent.com/a/xyz
                    policyVersion: '2026-11'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/current:
    delete:
      tags: [Auth]
      operationId: deleteCurrentSession
      summary: Đăng xuất
      description: |
        Gọi `revokeRefreshTokens(uid)` → mọi ID token hiện có bị từ chối (`checkRevoked`). Client gọi thêm
        `signOut()` của Firebase Auth và ngắt presence RTDB. [ASSUMED → Q-044] Đăng xuất kết thúc phiên trên **mọi thiết bị**
        (Firebase không thu hồi theo từng thiết bị; quản lý phiên nhiều thiết bị là SUP-14, ngoài phạm vi).
      x-business: [BIZ-01]
      x-screens: [SCR-11.A4, SCR-02.A5]
      x-roles: [ACT-01]
      x-nfr: [NFR-11]
      x-errors: [UNAUTHENTICATED]
      responses:
        '204':
          description: Đã kết thúc phiên
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /accounts:
    post:
      tags: [Auth]
      operationId: createAccount
      summary: Đồng ý chính sách quyền riêng tư và tạo tài khoản (lần đầu)
      description: |
        Tạo trong một transaction: `users/{uid}` (`anonymous = true`, `show_online = true`, `consent_at = now`),
        `profiles/{uid}` (tên Google; thiếu tên → phần trước "@" của email — FLOW-01 E2), `email_index/{email_norm}`.
        Email lấy từ ID token (không nhận từ body). Idempotent: tài khoản đã tồn tại → `200` trả tài khoản hiện có.
      x-business: [BIZ-01]
      x-screens: [SCR-01.A2]
      x-roles: [ACT-01, ACT-02]
      x-nfr: [NFR-17]
      x-errors: [UNAUTHENTICATED, VALIDATION_FAILED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
            example:
              acceptPrivacyPolicy: true
              policyVersion: '2026-11'
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeWithLimits'
              example:
                me:
                  uid: u_9Kd3Pq
                  email: binh.tran@gmail.com
                  displayName: Bình Trần
                  photoUrl: https://lh3.googleusercontent.com/a/xyz
                  anonymous: true
                  showOnline: true
                  status: active
                  consentAt: '2026-11-12T03:10:00Z'
                  createdAt: '2026-11-12T03:10:00Z'
                limits:
                  maxRoomMembers: 50
                  maxImagesPerMessage: 10
                  maxImageBytesPerMessage: 10485760
                  ttlDaysOptions: [1, 2, 3, 7, 30, 90]
                  inviteTtlDays: 7
                  notificationTtlDays: 30
                  emailLookupsPerHour: 100
                  rejectCooldownHours: 24
                  maxMessageChars: 1000
                  displayNameMax: 50
                  roomNameMax: 50
                  sessionIdleDays: 30
        '200':
          description: Tài khoản đã tồn tại (gọi lại)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeWithLimits'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Tải hồ sơ của tôi và giới hạn cấu hình (khởi động app)
      description: |
        Đọc `users`, `profiles`, `config/limits` (cache 5 phút). Cập nhật `users.last_active_at` tối đa 1 lần / giờ.
        Quá `sessionIdleDays` → thu hồi phiên, `401 SESSION_EXPIRED` (NFR-11).
      x-business: [BIZ-01, BIZ-02]
      x-screens: [LAYOUT.A1]
      x-roles: [ACT-01]
      x-nfr: [NFR-08, NFR-11]
      x-errors: [UNAUTHENTICATED, TOKEN_REVOKED, SESSION_EXPIRED, CONSENT_REQUIRED]
      responses:
        '200':
          description: Hồ sơ và giới hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeWithLimits'
              example:
                me:
                  uid: u_7Hq2Lx
                  email: an.nguyen@gmail.com
                  displayName: An Nguyễn
                  photoUrl: https://lh3.googleusercontent.com/a/abc
                  anonymous: true
                  showOnline: true
                  status: active
                  consentAt: '2026-11-01T08:00:00Z'
                  createdAt: '2026-11-01T08:00:00Z'
                limits:
                  maxRoomMembers: 50
                  maxImagesPerMessage: 10
                  maxImageBytesPerMessage: 10485760
                  ttlDaysOptions: [1, 2, 3, 7, 30, 90]
                  inviteTtlDays: 7
                  notificationTtlDays: 30
                  emailLookupsPerHour: 100
                  rejectCooldownHours: 24
                  maxMessageChars: 1000
                  displayNameMax: 50
                  roomNameMax: 50
                  sessionIdleDays: 30
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: '`CONSENT_REQUIRED` — chưa có tài khoản Buddio'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Đổi tên hiển thị / bật-tắt ẩn danh / bật-tắt hiển thị online
      description: |
        Gửi một hoặc nhiều field. Đổi tên → `profiles.display_name`, `display_name_custom = true` (tên mới hiện ở mọi nơi,
        kể cả tin cũ — Q-029). `anonymous` / `showOnline` lưu ngay khi gạt công tắc (FLOW-02 A1).
        Tắt `showOnline` → client đồng thời ghi `status/{uid}.state = offline` ở RTDB (ADR-05).
      x-business: [BIZ-02]
      x-screens: [SCR-11.A1, SCR-11.A2, SCR-11.A3]
      x-roles: [ACT-01]
      x-nfr: [NFR-04]
      x-errors: [VALIDATION_FAILED, DISPLAY_NAME_INVALID, CONSENT_REQUIRED]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
            examples:
              rename:
                summary: Đổi tên
                value:
                  displayName: An Gamer
              anonymousOff:
                summary: Tắt ẩn danh
                value:
                  anonymous: false
      responses:
        '200':
          description: Hồ sơ sau cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                uid: u_7Hq2Lx
                email: an.nguyen@gmail.com
                displayName: An Gamer
                photoUrl: https://lh3.googleusercontent.com/a/abc
                anonymous: true
                showOnline: true
                status: active
                consentAt: '2026-11-01T08:00:00Z'
                createdAt: '2026-11-01T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: '`DISPLAY_NAME_INVALID` (BR-29) — tên trống sau trim hoặc > 50 ký tự; giữ tên cũ'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: Xóa tài khoản
      description: |
        Phần tức thì (một transaction): `users.status = deleted`, `deleted_at`, xóa `email_norm`; `profiles.status = deleted`,
        xóa tên / ảnh / email; xóa `email_index`; `revokeRefreshTokens`. Sau đó đẩy task `purgeAccount` (ADR-11):
        rời từng phòng (tự chuyển host cho thành viên vào sớm nhất + thông báo SUP-02, phòng trống → `purgeRoom`),
        hủy bạn bè, đóng lời mời (`account_deleted`), xóa quan hệ chặn, xóa Firebase Auth user (BR-28).
        Xác nhận "không khôi phục được" là việc của UI.
      x-business: [BIZ-11]
      x-screens: [SCR-11.A5]
      x-roles: [ACT-01]
      x-supporting: [SUP-02, SUP-08]
      x-nfr: [NFR-11, NFR-18]
      x-errors: [UNAUTHENTICATED, CONSENT_REQUIRED]
      responses:
        '202':
          description: Tài khoản đã ở trạng thái Đã xóa; dọn dữ liệu chạy nền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleted'
              example:
                status: deleted
                deletedAt: '2026-11-12T04:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /email-lookups:
    post:
      tags: [FriendRequests]
      operationId: createEmailLookup
      summary: Tra email để kết bạn
      description: |
        Trả kiểu kết quả theo BIZ-03 (thứ tự kiểm tra):
        `self` (a) → có quan hệ chặn bất kỳ chiều nào → `not_found` → `already_friends` (b) → `pending_sent` (c)
        → `reject_cooldown` (d) → `found` (e: tắt ẩn danh, không chặn, chưa là bạn) → `not_found` (f).

        **BR-04 / NFR-15:** `not_found` gộp chưa đăng ký / đang ẩn danh / có chặn — body **giống hệt nhau** (chỉ
        `{"result":"not_found"}`), thời gian phản hồi được làm đều về một mức tối thiểu cố định cho mọi kết quả.
        [ASSUMED → Q-044] Kiểm tra chặn đứng trước (d): người đã từ chối mình rồi chặn mình → `not_found`, không lộ.
        Mỗi lần tra tăng `users.lookup_window.count`; vượt `emailLookupsPerHour` (100) → `429` trong phần còn lại của
        cửa sổ 1 giờ (NFR-16). Email gửi trong body, không ghi log dạng đọc được (NFR-27).
