                      toUid: u_9Kd3Pq
                      channel: link
                      status: pending
                      createdAt: '2026-11-12T03:22:00Z'
                    inviter:
                      uid: u_7Hq2Lx
                      displayName: An Nguyễn
                      photoUrl: https://lh3.googleusercontent.com/a/abc
                      status: active
        '400':
