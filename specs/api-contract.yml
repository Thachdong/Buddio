                      photoUrl: https://lh3.googleusercontent.com/a/xyz
                notFound:
                  summary: f — Không tìm thấy (mọi lý do giống hệt nhau)
                  value:
                    result: not_found
                pendingSent:
                  summary: c — Đang chờ phản hồi
